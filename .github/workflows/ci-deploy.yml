name: CI and production deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oveo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      # The host scripts move production data. The runner has no unprivileged user
      # namespaces, so their tests run here as root, and must run rather than skip.
      - name: Host-script tests as root
        env:
          OVEO_REQUIRE_HOST_TESTS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          sudo --preserve-env=OVEO_REQUIRE_HOST_TESTS,PYTHONDONTWRITEBYTECODE
          .venv/bin/python -m pytest -p no:cacheprovider -rs tests/test_host_scripts.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: quality
    runs-on: ubuntu-latest
    env:
      DOCKER_CONFIG: /tmp/oveo-docker-config
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create isolated Docker client configuration
        run: install -d -m 0700 "$DOCKER_CONFIG"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/pstngh/oveo:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The rehearsal starts the image through compose.yml itself, at the production
      # paths on this disposable runner, so env_file parsing (the `$` in the Argon2
      # hashes), the mount and the limits are exactly what the host will use.
      - name: Rehearse the exact image with a fresh database
        env:
          IMAGE: ghcr.io/pstngh/oveo@${{ steps.build.outputs.digest }}
        run: |
          set -eu
          runtime=$(mktemp "$RUNNER_TEMP/oveo-runtime.XXXXXX")
          # runtime.env is root-only, as on the host, and compose reads it client-side.
          compose() {
            sudo env OVEO_IMAGE="$IMAGE" docker compose --project-name oveo-rehearsal \
              -f compose.yml "$@"
          }
          cleanup() {
            compose down --timeout 5 >/dev/null 2>&1 || true
            sudo rm -f -- /etc/oveo/runtime.env
            sudo rm -rf -- /var/lib/oveo
            rm -f -- "$runtime"
          }
          trap cleanup EXIT HUP INT TERM
          if [ -e /etc/oveo/runtime.env ] || [ -e /var/lib/oveo ]; then
            echo "The runner already has Oveo paths; refusing to rehearse over them." >&2
            exit 1
          fi
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            | grep -Fx "$GITHUB_SHA"
          charles_hash=$(printf '%s\n' 'synthetic-charles-password' \
            | docker run --rm --entrypoint oveo-admin -i "$IMAGE" \
              hash-password --password-stdin)
          yousra_hash=$(printf '%s\n' 'synthetic-yousra-password' \
            | docker run --rm --entrypoint oveo-admin -i "$IMAGE" \
              hash-password --password-stdin)
          # Construct a validator-shaped non-secret at runtime so secret scanners never
          # encounter a credential-shaped literal in the repository.
          synthetic_api_key="sk-or-v1-$(printf '%064d' 0)"
          printf '%s\n' \
            'OVEO_ENVIRONMENT=production' \
            'OVEO_PUBLIC_ORIGIN=https://127.0.0.1' \
            'OVEO_TRUSTED_HOSTS=["localhost","127.0.0.1"]' \
            'OVEO_DATA_DIR=/data' \
            'OVEO_DATABASE_URL=sqlite+aiosqlite:////data/oveo.sqlite3' \
            'OVEO_ATTACHMENTS_DIR=/data/attachments' \
            'OVEO_FRONTEND_DIR=/app/frontend' \
            'OVEO_PROMPTS_DIR=/app/prompts' \
            "OVEO_OPENROUTER_API_KEY=$synthetic_api_key" \
            "OVEO_CHARLES_PASSWORD_HASH='$charles_hash'" \
            "OVEO_YOUSRA_PASSWORD_HASH='$yousra_hash'" > "$runtime"
          sudo install -d -m 0700 /etc/oveo
          sudo install -m 0600 "$runtime" /etc/oveo/runtime.env
          sudo install -d -m 0700 -o 10001 -g 10001 /var/lib/oveo /var/lib/oveo/attachments
          compose config --quiet
          compose up --detach app
          attempt=0
          until curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:8000/health/ready >/dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 45 ] || [ -z "$(compose ps --status running --quiet app)" ]; then
              compose logs app
              exit 1
            fi
            sleep 2
          done
          # Deployments ask the image for its migrations before starting it; the
          # fresh database must be at the head the image reports.
          head=$(docker run --rm --pull never --network none --read-only \
            --user 10001:10001 --entrypoint oveo-admin "$IMAGE" \
            schema-revisions --config /app/alembic.ini | sed -n '1p')
          printf '%s\n' "$head" | grep -Eq '^[A-Za-z0-9_]+$'
          compose exec -T --env EXPECTED_HEAD="$head" app python -c \
            "import os, sqlite3; db=sqlite3.connect('/data/oveo.sqlite3'); assert db.execute('SELECT username FROM users ORDER BY username').fetchall() == [('charles',), ('yousra',)]; assert 'role' not in {row[1] for row in db.execute('PRAGMA table_info(users)')}; assert db.execute('SELECT version_num FROM alembic_version').fetchone() == (os.environ['EXPECTED_HEAD'],); attachment_columns={row[1]: row[3] for row in db.execute('PRAGMA table_info(attachments)')}; assert attachment_columns['document_blocks'] == 1; assert attachment_columns['role'] == 1; attachment_schema=db.execute(\"SELECT sql FROM sqlite_master WHERE type='table' AND name='attachments'\").fetchone()[0]; assert 'ck_attachments_docx_media_type' in attachment_schema; assert 'ck_attachments_role' in attachment_schema"
          # Signing in proves each hash reached the application intact through env_file.
          for account in charles yousra; do
            printf '{"username":"%s","password":"synthetic-%s-password"}' "$account" "$account" \
              | curl --fail --silent --show-error --max-time 30 --output /dev/null \
                --header 'Content-Type: application/json' --data-binary @- \
                http://127.0.0.1:8000/api/auth/login
          done
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.OVEO_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [quality, publish]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: oveo-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The checksum travels with the bundle; the host checks it before extracting.
      - name: Package host bundle
        run: |
          tar --create --gzip --file "oveo-host-${GITHUB_SHA}.tar.gz" \
            compose.yml deploy/install-host.sh \
            deploy/oveo-deploy.sh deploy/oveo-deploy-detached.sh \
            deploy/oveo-backup.sh deploy/oveo-restore.sh deploy/oveo-backup-alert.sh \
            deploy/backup_tool.py \
            deploy/validate_staging.py \
            deploy/runtime.env.example deploy/backup.env.example deploy/systemd
          sha256sum "oveo-host-${GITHUB_SHA}.tar.gz" \
            > "oveo-host-${GITHUB_SHA}.tar.gz.sha256"
      - name: Prepare pinned SSH access
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Stage host operations bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "oveo-host-${GITHUB_SHA}.tar.gz" \
            "oveo-host-${GITHUB_SHA}.tar.gz.sha256" \
            "$VPS_USER@$VPS_HOST:/var/tmp/"
      # The staged bundle's oveo-deploy starts the candidate with the bundle's compose
      # file and installs the bundle only after the candidate passed its checks. It runs
      # as its own systemd unit, so cancelling this job or losing the connection cannot
      # stop it halfway; its output is followed from the journal.
      - name: Deploy exact published digest
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ghcr.io/pstngh/oveo@${{ needs.publish.outputs.digest }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "$VPS_USER@$VPS_HOST" \
            "read -r token; set -eu; stage=/var/tmp/oveo-host-${GITHUB_SHA}; archive=\$stage.tar.gz; checksum=\$archive.sha256; unit=oveo-deploy-${GITHUB_SHA}.service; case \"\$(systemctl show --property=ActiveState --value \"\$unit\")\" in inactive|failed) ;; *) echo \"\$unit is still running: an earlier run of this deployment has not finished (see OPERATIONS.md)\" >&2; exit 1 ;; esac; cleanup() { rm -f -- \"\$archive\" \"\$checksum\"; rm -rf -- \"\$stage\"; }; trap cleanup EXIT HUP INT TERM; cd /var/tmp; sha256sum --check \"\$checksum\"; rm -rf -- \"\$stage\"; mkdir \"\$stage\"; tar --extract --gzip --file \"\$archive\" --directory \"\$stage\"; trap - EXIT HUP INT TERM; printf '%s\\n' \"\$token\" | \"\$stage/deploy/oveo-deploy-detached.sh\" '$IMAGE' '$GHCR_USER'"
      - name: Verify public production readiness
        run: curl --fail --silent --show-error --max-time 20 "https://oveo.duckdns.org/health/ready"
