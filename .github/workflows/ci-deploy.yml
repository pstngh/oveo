name: CI and production deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oveo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: quality
    runs-on: ubuntu-latest
    env:
      DOCKER_CONFIG: /tmp/oveo-docker-config
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Docker client configuration
        run: install -d -m 0700 "$DOCKER_CONFIG"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/pstngh/oveo:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rehearse the exact image with a fresh database
        env:
          IMAGE: ghcr.io/pstngh/oveo@${{ steps.build.outputs.digest }}
        run: |
          set -eu
          container="oveo-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_dir=$(mktemp -d "$RUNNER_TEMP/oveo-rehearsal.XXXXXX")
          runtime=$(mktemp "$RUNNER_TEMP/oveo-runtime.XXXXXX")
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            sudo rm -f -- /etc/oveo/runtime.env
            rm -f -- "$runtime"
            case "$data_dir" in
              "$RUNNER_TEMP"/oveo-rehearsal.*) sudo rm -rf -- "$data_dir" ;;
              *) echo "Refusing unsafe rehearsal cleanup: $data_dir" >&2 ;;
            esac
          }
          trap cleanup EXIT HUP INT TERM
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            | grep -Fx "$GITHUB_SHA"
          charles_hash=$(printf '%s\n' 'synthetic-charles-password' \
            | docker run --rm --entrypoint oveo-admin -i "$IMAGE" \
              hash-password --password-stdin)
          yousra_hash=$(printf '%s\n' 'synthetic-yousra-password' \
            | docker run --rm --entrypoint oveo-admin -i "$IMAGE" \
              hash-password --password-stdin)
          # Construct a validator-shaped non-secret at runtime so secret scanners never
          # encounter a credential-shaped literal in the repository.
          synthetic_api_key="sk-or-v1-$(printf '%064d' 0)"
          printf '%s\n' \
            'OVEO_ENVIRONMENT=production' \
            'OVEO_PUBLIC_ORIGIN=https://127.0.0.1' \
            'OVEO_TRUSTED_HOSTS=["localhost","127.0.0.1"]' \
            'OVEO_DATA_DIR=/data' \
            'OVEO_DATABASE_URL=sqlite+aiosqlite:////data/oveo.sqlite3' \
            'OVEO_ATTACHMENTS_DIR=/data/attachments' \
            'OVEO_FRONTEND_DIR=/app/frontend' \
            'OVEO_PROMPTS_DIR=/app/prompts' \
            "OVEO_OPENROUTER_API_KEY=$synthetic_api_key" \
            "OVEO_CHARLES_PASSWORD_HASH='$charles_hash'" \
            "OVEO_YOUSRA_PASSWORD_HASH='$yousra_hash'" > "$runtime"
          sudo install -d -m 0700 /etc/oveo
          sudo install -m 0600 "$runtime" /etc/oveo/runtime.env
          sudo env OVEO_IMAGE="$IMAGE" docker compose --project-name oveo-rehearsal \
            -f compose.yml config --quiet
          sudo chown 10001:10001 "$data_dir"
          sudo chmod 0700 "$data_dir"
          docker run --detach --name "$container" \
            --user 10001:10001 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 \
            --cpus 0.80 --memory 384m --memory-swap 768m \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1700,uid=10001,gid=10001,size=64m \
            --mount "type=bind,src=$data_dir,dst=/data" \
            --env OVEO_ENVIRONMENT=production \
            --env OVEO_PUBLIC_ORIGIN=https://127.0.0.1 \
            --env 'OVEO_TRUSTED_HOSTS=["localhost","127.0.0.1"]' \
            --env OVEO_OPENROUTER_API_KEY="$synthetic_api_key" \
            --env OVEO_CHARLES_PASSWORD_HASH="$charles_hash" \
            --env OVEO_YOUSRA_PASSWORD_HASH="$yousra_hash" \
            "$IMAGE"
          attempt=0
          until docker exec "$container" python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 45 ] || [ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker exec "$container" python -c \
            "import sqlite3; db=sqlite3.connect('/data/oveo.sqlite3'); assert db.execute('SELECT username, role FROM users ORDER BY username').fetchall() == [('charles', 'owner'), ('yousra', 'user')]; assert db.execute('SELECT version_num FROM alembic_version').fetchone()"
          printf 'OVEO_REHEARSED_IMAGE=%s\nOVEO_REHEARSED_COMMIT=%s\n' \
            "$IMAGE" "$GITHUB_SHA" > REHEARSAL
      - name: Package checksummed host operations bundle
        env:
          IMAGE: ghcr.io/pstngh/oveo@${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$IMAGE" > IMAGE
          tar --create --gzip --file "oveo-host-${GITHUB_SHA}.tar.gz" \
            compose.yml OPERATIONS.md IMAGE REHEARSAL deploy/install-host.sh \
            deploy/oveo-deploy.sh deploy/remove-v1.sh \
            deploy/oveo-backup.sh deploy/oveo-restore.sh deploy/backup_tool.py \
            deploy/validate_staging.py \
            deploy/runtime.env.example deploy/backup.env.example deploy/systemd
          sha256sum "oveo-host-${GITHUB_SHA}.tar.gz" \
            > "oveo-host-${GITHUB_SHA}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: oveo-host-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            oveo-host-${{ github.sha }}.tar.gz
            oveo-host-${{ github.sha }}.tar.gz.sha256

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.OVEO_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [quality, publish]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
      packages: read
    concurrency:
      group: oveo-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oveo-host-${{ github.sha }}
      - name: Verify host bundle
        run: sha256sum --check "oveo-host-${GITHUB_SHA}.tar.gz.sha256"
      - name: Prepare pinned SSH access
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Stage host operations bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "oveo-host-${GITHUB_SHA}.tar.gz" \
            "oveo-host-${GITHUB_SHA}.tar.gz.sha256" \
            "$VPS_USER@$VPS_HOST:/var/tmp/"
      - name: Deploy exact published digest
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ghcr.io/pstngh/oveo@${{ needs.publish.outputs.digest }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "$VPS_USER@$VPS_HOST" \
            "read -r token; set -eu; stage=/var/tmp/oveo-host-${GITHUB_SHA}; archive=\$stage.tar.gz; checksum=\$archive.sha256; docker_config=; cleanup() { if [ -n \"\$docker_config\" ]; then DOCKER_CONFIG=\$docker_config docker logout ghcr.io >/dev/null 2>&1 || true; fi; rm -f -- \"\$archive\" \"\$checksum\"; rm -rf -- \"\$stage\"; }; trap cleanup EXIT HUP INT TERM; cd /var/tmp; sha256sum --check \"\$checksum\"; rm -rf -- \"\$stage\"; mkdir \"\$stage\"; tar --extract --gzip --file \"\$archive\" --directory \"\$stage\"; \"\$stage/deploy/install-host.sh\"; docker_config=\$stage/docker-config; install -d -m 0700 \"\$docker_config\"; export DOCKER_CONFIG=\$docker_config; if ! printf '%s' \"\$token\" | docker login ghcr.io --username '$GHCR_USER' --password-stdin >/dev/null; then unset token; exit 1; fi; unset token; if docker inspect translation-agent-staging-app-1 >/dev/null 2>&1; then /usr/local/sbin/oveo-remove-v1 '$IMAGE' --confirm REMOVE_V1; fi; set +e; /usr/local/sbin/oveo-deploy '$IMAGE'; status=\$?; exit \$status"
      - name: Verify public production readiness
        run: curl --fail --silent --show-error --max-time 20 "https://oveo.duckdns.org/health/ready"
