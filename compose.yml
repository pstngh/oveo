name: oveo

services:
  app:
    image: ${OVEO_IMAGE:?OVEO_IMAGE must be an immutable ghcr.io/pstngh/oveo digest}
    restart: unless-stopped
    env_file:
      - /etc/oveo/runtime.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/lib/oveo:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1700,uid=10001,gid=10001,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    pids_limit: 128
    cpus: 0.80
    mem_limit: 384m
    memswap_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

