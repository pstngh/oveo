[project]
name = "oveo"
version = "2.1.0"
description = "Private three-section AI translation, revision, and internal communications adviser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "lxml>=6,<7",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "tiktoken>=0.14,<1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  # 9.0.3 fixes GHSA-6w46-j5rx-g56g (CVE-2025-71176): predictable /tmp/pytest-of-{user}.
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
oveo-admin = "oveo.admin:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oveo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "live: calls the pinned model; needs OVEO_LIVE_EVALS=1 and OVEO_OPENROUTER_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["oveo"]

[tool.coverage.run]
source = ["oveo"]
branch = true
# Code after an awaited SQLAlchemy call runs in a greenlet; without this it is
# reported as never executed.
concurrency = ["thread", "greenlet"]
