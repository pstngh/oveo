# Public-key authentication only. Root remains available by key because the
# protected GitHub Actions deployment currently connects as root.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password

# Only the two administered accounts may start SSH sessions.
AllowUsers root debian

# Reduce exposed SSH features and unauthenticated connection pressure.
DisableForwarding yes
X11Forwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
MaxSessions 4
MaxStartups 10:30:30
PerSourceMaxStartups 3
UseDNS no
